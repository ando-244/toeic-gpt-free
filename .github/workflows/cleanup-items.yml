name: Cleanup old TOEIC items (90 days)

on:
  schedule:
    - cron: "0 18 * * 0"  # 毎週日曜 JST 3:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cleanup old items (older than 90 days)
        run: |
          python .tools/cleanup_items.py

      - name: Rebuild manifest
        run: |
          python tools/build_manifest.py

      - name: Commit and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet; then
            echo "No cleanup needed."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add items media public/manifest.json
          git commit -m "auto: cleanup TOEIC items older than 90 days"
          git push origin main
